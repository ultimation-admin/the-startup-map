name = "the-startup-map"
main = ".open-next/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[[ratelimits]]
name = "PUBLIC_READ_LIMITER"
namespace_id = "2026110201"

[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "MEDIA_READ_LIMITER"
namespace_id = "2026110202"

[ratelimits.simple]
limit = 45
period = 60
